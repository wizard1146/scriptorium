<p>The Explore pool is a pool of acres available to each individual province in a kingdom to use for <a href="explore.html">exploring</a>. This pool begins at the start of the age at 5000 acres and grows by 100 acres each hour. The pool decays, while not in war, at .5% an hour.</p>
